{% extends 'base.html' %}

{% block title %}Password Reset Complete | PlayBite{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5" style="background: #fffaf2;">
        <h1 class="h4 mb-3">Password reset complete</h1>
        <p class="text-muted">Your password has been updated successfully.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-warning text-white mt-4">Login with your new password</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
