{% extends 'base.html' %}

{% block title %}Password Reset Sent | PlayBite{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-lg-6">
    <div class="card auth-card shadow-sm border-0">
      <div class="card-body auth-card-body p-5">
        <h1 class="h4 mb-3">Reset link sent</h1>
        <p class="text-muted">If an account exists with that email, you will receive password reset instructions shortly.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-warning text-white mt-4">Return to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
