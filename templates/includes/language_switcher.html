{% load i18n %}{% get_current_language as LANGUAGE_CODE %}<form action="{% url 'set_language' %}" method="post" class="pb-language-form">{% csrf_token %}<input name="next" type="hidden" value="{{ request.get_full_path }}"><label class="visually-hidden" for="pb-language-{% if LANGUAGE_CODE == 'ar' %}ar{% else %}en{% endif %}">{% translate "Language" %}</label><select id="pb-language-{% if LANGUAGE_CODE == 'ar' %}ar{% else %}en{% endif %}" name="language" class="pb-language-select" aria-label="{% translate 'Language' %}" onchange="this.form.submit()"><option value="en"{% if LANGUAGE_CODE == 'en' %} selected{% endif %}>English 🇬🇧</option><option value="ar"{% if LANGUAGE_CODE == 'ar' %} selected{% endif %}>العربية 🇸🇦</option></select></form>
