{% load static i18n %}
<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>{% block title %}PlayBite{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/play.css' %}" />
  {% block extra_css %}{% endblock %}
</head>
<body class="play-body">
  <a class="visually-hidden-focusable skip-link" href="#play-main">Skip to main content</a>
  <header class="play-mini-header sticky-top d-flex align-items-center justify-content-between px-3 px-sm-4 py-2">
    <a class="pb-brand text-decoration-none" href="/"><img class="pb-brand-logo" src="{% static 'images/playbite-logo.png' %}" alt="" width="38" height="38"><span>PlayBite</span></a>
    <div class="d-flex align-items-center gap-2">{% include 'includes/language_switcher.html' %}<button type="button" class="btn pb-icon-btn theme-toggle" data-theme-toggle aria-label="Toggle color theme">
      <span class="theme-icon theme-icon-moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"/></svg></span><span class="theme-icon theme-icon-sun" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
    </button></div>
  </header>
  <div id="play-main" tabindex="-1">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="{% static 'js/main.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
