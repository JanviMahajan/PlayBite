{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>{% block title %}PlayBite{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <link rel="stylesheet" href="{% static 'css/play.css' %}" />
  {% block extra_css %}{% endblock %}
</head>
<body class="play-body">
  <a class="visually-hidden-focusable skip-link" href="#play-main">Skip to main content</a>
  <header class="play-mini-header sticky-top d-flex align-items-center justify-content-between px-3 py-2">
    <a class="navbar-brand fw-semibold text-decoration-none" href="/">PlayBite</a>
    <button type="button" class="btn btn-sm btn-outline-secondary theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
      <span aria-hidden="true">🌓</span>
    </button>
  </header>
  <div id="play-main" tabindex="-1">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="{% static 'js/main.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
